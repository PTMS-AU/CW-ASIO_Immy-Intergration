name: Validate

# Alpha is the default branch and the one that mirrors the live ImmyBot
# instance; beta is the integration line under test. The previous version of
# this workflow triggered on `main`, which does not exist in this repo — so CI
# had never actually run.
on:
  push:
    branches: [alpha, beta, main, 'claude/**']
  pull_request:
    branches: [alpha, beta, main]

permissions:
  contents: read

jobs:
  validate:
    name: Parse, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hard gate. A file that does not parse cannot be pasted into ImmyBot.
      # This also covers the helper source, which lives inside a here-string in
      # the integration script and is therefore invisible to a plain file parse.
      - name: Parse all scripts
        shell: pwsh
        run: |
          $fail = 0

          Get-ChildItem -Path . -Include '*.ps1','*.psm1' -Recurse | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $fail++
                  Write-Host "::error file=$($_.FullName)::$($errors[0].Message) (line $($errors[0].Extent.StartLineNumber))"
              }
          }

          if ($fail -gt 0) { throw "$fail parse failure(s)." }
          Write-Host "All scripts parse."

      # Hard gate, and the cheapest signal here. ImmyBot runs integration blocks
      # in ConstrainedLanguage mode; a normal pwsh runs FullLanguage and will
      # happily execute code that fails in situ with "Method invocation is
      # supported only on core types in this language mode". Static analysis is
      # the only way to catch that without a live ImmyBot.
      - name: ConstrainedLanguage compliance
        shell: pwsh
        run: ./tests/Test-ConstrainedLanguage.ps1

      # Hard gate. Covers the module's pure logic: client-ref parsing, Link
      # header pagination, batching, site-id resolution, scope selection, and
      # the IntegrationContext-backed token cache.
      - name: Run module tests
        shell: pwsh
        run: ./tests/Test-CwHelpers.ps1

      # Hard gate. Enforces the script/module contract: every capability block
      # imports CWPlatformAPI, and the script only calls exported functions.
      # This is what beta.1 got wrong.
      - name: Run integration structure tests
        shell: pwsh
        run: ./tests/Test-IntegrationStructure.ps1

      # Advisory. Errors fail the build; warnings are surfaced as annotations
      # without failing, because the warning-level baseline has not been cleaned
      # up yet. Tighten to -Severity Warning,Error once it is.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1

          $errors   = @($results | Where-Object Severity -eq 'Error')
          $warnings = @($results | Where-Object Severity -eq 'Warning')

          foreach ($r in $results) {
              $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
              Write-Host "::${level} file=$($r.ScriptPath),line=$($r.Line)::[$($r.RuleName)] $($r.Message)"
          }

          Write-Host "PSScriptAnalyzer: $($errors.Count) error(s), $($warnings.Count) warning(s)."
          if ($errors.Count -gt 0) { throw "$($errors.Count) PSScriptAnalyzer error(s)." }
